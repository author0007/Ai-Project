<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 640px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
        }

        .length-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: #ecf0f1;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .length-value {
            min-width: 50px;
            text-align: center;
            font-weight: 700;
            color: #667eea;
            font-size: 18px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .checkbox-item:hover {
            background: #e9ecef;
        }

        .checkbox-item.active {
            background: #eef2ff;
            border-color: #667eea;
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item span {
            font-size: 14px;
            color: #2c3e50;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results {
            margin-top: 32px;
            border-top: 1px solid #ecf0f1;
            padding-top: 24px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .results-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }

        .btn-copy-all {
            padding: 6px 12px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 12px;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy-all:hover {
            background: #e9ecef;
        }

        .password-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .password-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-family: "Courier New", monospace;
            font-size: 14px;
            transition: background 0.2s;
        }

        .password-item:hover {
            background: #eef2ff;
        }

        .password-text {
            flex: 1;
            word-break: break-all;
            color: #2c3e50;
            user-select: all;
        }

        .password-actions {
            display: flex;
            gap: 8px;
            margin-left: 12px;
        }

        .btn-icon {
            padding: 4px 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background: #dee2e6;
        }

        .empty-state {
            text-align: center;
            color: #adb5bd;
            padding: 32px 0;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2c3e50;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .strength-meter {
            margin-top: 8px;
            height: 4px;
            background: #ecf0f1;
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 密码生成器</h1>
        <p class="subtitle">本地运行 · 密码学安全 · 支持批量生成</p>

        <div class="form-group">
            <label>密码长度：<span id="lengthDisplay">16</span></label>
            <div class="length-control">
                <input type="range" id="lengthSlider" min="4" max="128" value="16">
                <span class="length-value" id="lengthValue">16</span>
            </div>
            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
        </div>

        <div class="form-group">
            <label>字符类型</label>
            <div class="checkbox-group">
                <label class="checkbox-item active">
                    <input type="checkbox" id="lowercase" checked>
                    <span>小写字母 a-z</span>
                </label>
                <label class="checkbox-item active">
                    <input type="checkbox" id="uppercase" checked>
                    <span>大写字母 A-Z</span>
                </label>
                <label class="checkbox-item active">
                    <input type="checkbox" id="digits" checked>
                    <span>数字 0-9</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="special">
                    <span>特殊字符 !@#$</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>生成数量</label>
            <input type="number" id="count" min="1" max="100" value="1">
        </div>

        <button class="btn-generate" id="generateBtn">生成密码</button>

        <div class="results" id="resultsSection" style="display: none;">
            <div class="results-header">
                <span class="results-title">生成结果</span>
                <button class="btn-copy-all" id="copyAllBtn">复制全部</button>
            </div>
            <div class="password-list" id="passwordList"></div>
        </div>

        <div class="empty-state" id="emptyState">点击"生成密码"按钮开始</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const lengthDisplay = document.getElementById('lengthDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const passwordList = document.getElementById('passwordList');
        const resultsSection = document.getElementById('resultsSection');
        const emptyState = document.getElementById('emptyState');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const strengthBar = document.getElementById('strengthBar');
        const toast = document.getElementById('toast');

        // 长度滑块联动
        lengthSlider.addEventListener('input', function() {
            const val = this.value;
            lengthValue.textContent = val;
            lengthDisplay.textContent = val;
            updateStrengthMeter();
        });

        // 复选框样式联动
        document.querySelectorAll('.checkbox-item input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', function() {
                this.parentElement.classList.toggle('active', this.checked);
                updateStrengthMeter();
            });
        });

        // 强度评估
        function updateStrengthMeter() {
            const length = parseInt(lengthSlider.value);
            const types = getCharTypes().length;
            let score = 0;

            if (length >= 8) score += 25;
            if (length >= 12) score += 25;
            if (length >= 16) score += 25;
            if (types >= 2) score += 12;
            if (types >= 3) score += 13;

            strengthBar.style.width = Math.min(score, 100) + '%';

            if (score < 40) {
                strengthBar.style.background = '#e74c3c';
            } else if (score < 70) {
                strengthBar.style.background = '#f39c12';
            } else {
                strengthBar.style.background = '#27ae60';
            }
        }

        function getCharTypes() {
            const types = [];
            if (document.getElementById('lowercase').checked) types.push('lowercase');
            if (document.getElementById('uppercase').checked) types.push('uppercase');
            if (document.getElementById('digits').checked) types.push('digits');
            if (document.getElementById('special').checked) types.push('special');
            return types;
        }

        // 生成密码
        generateBtn.addEventListener('click', async function() {
            const charTypes = getCharTypes();
            if (charTypes.length === 0) {
                showToast('请至少选择一种字符类型');
                return;
            }

            const length = parseInt(lengthSlider.value);
            const count = parseInt(document.getElementById('count').value) || 1;

            generateBtn.disabled = true;
            generateBtn.textContent = '生成中...';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        length: length,
                        char_types: charTypes,
                        count: count
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showToast(data.error || '生成失败');
                    return;
                }

                renderPasswords(data.passwords);
            } catch (err) {
                showToast('网络错误，请检查服务是否运行');
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = '生成密码';
            }
        });

        function renderPasswords(passwords) {
            emptyState.style.display = 'none';
            resultsSection.style.display = 'block';
            passwordList.innerHTML = '';

            passwords.forEach((pwd, idx) => {
                const item = document.createElement('div');
                item.className = 'password-item';
                item.innerHTML = `
                    <span class="password-text">${escapeHtml(pwd)}</span>
                    <div class="password-actions">
                        <button class="btn-icon" onclick="copyPassword('${pwd}')" title="复制">📋</button>
                    </div>
                `;
                passwordList.appendChild(item);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 复制单个密码
        window.copyPassword = function(pwd) {
            navigator.clipboard.writeText(pwd).then(() => {
                showToast('已复制到剪贴板');
            }).catch(() => {
                showToast('复制失败');
            });
        };

        // 复制全部
        copyAllBtn.addEventListener('click', function() {
            const items = document.querySelectorAll('.password-text');
            const all = Array.from(items).map(el => el.textContent).join('\n');
            navigator.clipboard.writeText(all).then(() => {
                showToast('已复制全部密码');
            }).catch(() => {
                showToast('复制失败');
            });
        });

        // 提示框
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 初始化
        updateStrengthMeter();
    </script>
</body>
</html>
